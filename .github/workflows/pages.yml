name: Publish story game
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cinematic-web/**', '.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify story paths and saves
        run: npm test
        working-directory: cinematic-web
      - name: Build the static site and offline file
        run: npm run build
        working-directory: cinematic-web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: cinematic-web/dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
